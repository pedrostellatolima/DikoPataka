<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Abrindo o WhatsApp… | Diko Pataka</title>
  <!-- se o javascript falhar, o navegador redireciona sozinho -->
  <meta http-equiv="refresh" content="1;url=https://wa.me/5511974717114" />
  <link rel="icon" type="image/png" href="logo-redondo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'DM Sans', system-ui, sans-serif;
      background:#ffc60d; color:#080d2e;
      min-height:100svh;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:22px;
      padding:32px; text-align:center;
    }
    img { width:min(60vw,190px); height:auto; }
    p { font-size:1rem; font-weight:400; color:rgba(8,13,46,.72); }
    .pontos span {
      display:inline-block; width:9px; height:9px; border-radius:50%;
      background:#042bc6; margin:0 3px;
      animation:pula 1.1s ease-in-out infinite;
    }
    .pontos span:nth-child(2) { animation-delay:.15s; }
    .pontos span:nth-child(3) { animation-delay:.3s; }
    @keyframes pula {
      0%,60%,100% { transform:translateY(0); opacity:.45; }
      30%         { transform:translateY(-9px); opacity:1; }
    }
    a { color:#042bc6; font-weight:700; font-size:.9rem; }
    @media (prefers-reduced-motion:reduce) { .pontos span { animation:none; } }
  </style>
</head>
<body>
  <img src="logo-diko.png" alt="Diko Pataka" />
  <p>Abrindo o WhatsApp…</p>
  <p class="pontos" aria-hidden="true"><span></span><span></span><span></span></p>
  <p><a href="https://wa.me/5511974717114">Não abriu? Toque aqui.</a></p>

  <script>
    /* pequena espera para o contador de visitas registrar a passagem,
       e então segue direto para a conversa */
    setTimeout(function () {
      location.replace('https://wa.me/5511974717114');
    }, 400);
  </script>
</body>
</html>
