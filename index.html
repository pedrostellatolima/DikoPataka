  <style>
    :root {

    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    html { -webkit-text-size-adjust:100%; }
    body {
      font-family:var(--f-body);
      background:var(--amarelo); color:var(--texto);

    a { color:inherit; text-decoration:none; }

    /* estrelas decorativas ao fundo */

      pointer-events:none; user-select:none; line-height:1;
      font-size:clamp(9rem,22vw,20rem);
    }
    .e1 { top:-4vh;    left:-3vw;  transform:rotate(-18deg); }
    .e2 { bottom:-6vh; right:-3vw; transform:rotate(14deg); }
    .e3 { top:42%; right:8%; font-size:clamp(3rem,6vw,6rem); opacity:.05; transform:rotate(9deg); }

    .w { position:relative; z-index:2; width:100%; max-width:760px; text-align:center; }

    .marca {
      width:clamp(230px,32vw,380px); height:auto;
      margin:0 auto 40px; display:block;

    .marca:hover { transform:rotate(-2deg) scale(1.03); }

    .sobrancelha {

    h1 {

      line-height:1.02; letter-spacing:-.035em;
      margin-bottom:26px;
    }
    h1 .azul { color:var(--azul); }
    /* letras fatiadas para o efeito de mola */
    .kin-word { display:inline-block; white-space:nowrap; }
    .kin-letter { display:inline-block; will-change:transform; font-kerning:none; }

    .recado {

      max-width:520px; margin:0 auto 38px;

    }
    .recado strong { font-weight:700; color:var(--texto); }
    /* a frase inteira desce junta em vez de deixar "visita" sozinha embaixo */
    .junto { white-space:nowrap; }

    .botoes { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:52px; }
    .btn {
      display:inline-flex; align-items:center; gap:9px;
      padding:16px 32px; border-radius:100px;
      font-size:.92rem; font-weight:700; letter-spacing:.02em;
      transition:transform .28s var(--ease), box-shadow .28s var(--ease), background .28s;
    }
    .btn svg { width:18px; height:18px; fill:currentColor; }
    .btn-azul { background:var(--azul); color:#fff; }
    .btn-azul:hover { background:var(--azul-medio); transform:translateY(-3px); box-shadow:0 14px 34px rgba(4,43,198,.34); }
    .btn-linha {
      background:transparent; color:var(--texto);
      box-shadow:inset 0 0 0 2px rgba(8,13,46,.22);
    }
    .btn-linha:hover { box-shadow:inset 0 0 0 2px var(--texto); transform:translateY(-3px); }

    .pe {
      border-top:1.5px solid rgba(8,13,46,.16);
      padding-top:28px;
      display:flex; flex-wrap:wrap; justify-content:center;
      gap:10px 30px;
      font-size:.88rem; color:rgba(8,13,46,.66);
    }
    .pe b { font-weight:700; color:var(--texto); }
    .pe span { display:inline-flex; align-items:center; gap:7px; }

    /* selo giratório dos 43 anos */
    .selo {
      position:fixed; right:clamp(16px,4vw,48px); bottom:clamp(16px,4vw,48px);
      width:104px; height:104px; z-index:3;
      background:var(--azul); border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 14px 38px rgba(4,43,198,.3);
      animation:flutua 4.5s ease-in-out infinite;
    }
    .selo b {
      font-family:var(--f-disp); font-weight:900; font-size:2.1rem;
      color:var(--amarelo); position:relative; z-index:2;
      top:-.039em; left:.01em;
    }
    /* o anel é montado com letras giradas uma a uma: o textPath do SVG
       embaralha no Safari por causa do textLength */
    .selo-anel {
      position:absolute; inset:0; z-index:1;
      animation:gira 15s linear infinite;
    }
    .selo-anel i {
      position:absolute; left:50%; top:9px;
      height:calc(50% - 9px);
      transform-origin:bottom center;
      font-family:var(--f-body); font-style:normal;
      font-weight:800; font-size:9px; line-height:1;
      text-transform:uppercase; color:#fff;
    }
    @keyframes gira { to { transform:rotate(360deg); } }
    @keyframes flutua { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }

    @media (max-width:640px) {

      .botoes .btn { width:100%; justify-content:center; }
      .pe { gap:8px 18px; font-size:.82rem; }
      body { padding:40px 20px 130px; }
    }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
    }

    a:focus-visible, button:focus-visible {
      outline:3px solid var(--azul); outline-offset:4px; border-radius:6px;

  <script>
    'use strict';

    /* monta o anel de texto do selo, letra por letra */
    (function () {
      const anel = document.querySelector('.selo-anel');
      if (!anel) return;
      const texto = '43 anos de tradição · desde 1983 · ';
      const passo = 360 / texto.length;
      anel.innerHTML = [...texto].map((ch, i) =>
        ch === ' ' ? '' :
        `<i style="transform:translateX(-50%) rotate(${(i * passo).toFixed(2)}deg)">${ch}</i>`
      ).join('');
    })();

    window.addEventListener('load', function () {
      if (typeof gsap === 'undefined') return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      /* fatia o título em letras, preservando as palavras */
      const titulo = document.querySelector('[data-kinetic]');
      const letras = [];
      titulo.querySelectorAll('.kin-line').forEach(linha => {
        const frag = document.createDocumentFragment();
        linha.textContent.split(' ').forEach((palavra, i, todas) => {
          if (palavra) {
            const w = document.createElement('span');
            w.className = 'kin-word';
            [...palavra].forEach(ch => {
              const s = document.createElement('span');
              s.className = 'kin-letter';
              s.textContent = ch;
              letras.push(s);
              w.appendChild(s);
            });
            frag.appendChild(w);
          }
          if (i < todas.length - 1) frag.appendChild(document.createTextNode(' '));
        });
        linha.innerHTML = '';
        linha.appendChild(frag);
      });

      /* entrada: as letras sobem em onda, sempre visíveis */
      gsap.from(letras, {
        yPercent: 110,
        rotation: () => gsap.utils.random(-8, 8),
        duration: .85, ease: 'back.out(1.7)',
        stagger: { each: .028 }, delay: .15,
        onComplete() { gsap.set(letras, { clearProps: 'all' }); }
      });

      /* mola ao passar o mouse, empurrando as vizinhas */
      letras.forEach(letra => {
        letra.addEventListener('pointerenter', () => {
          const irmas = [...letra.parentNode.children];
          const i = irmas.indexOf(letra);
          const giro = gsap.utils.random(-14, 14);
          const pula = (el, dy, r, s) => {
            gsap.killTweensOf(el);
            gsap.timeline()
              .to(el, { y: dy, rotation: r, scale: s, duration: .16, ease: 'power2.out' })
              .to(el, { y: 0, rotation: 0, scale: 1, duration: 1.1, ease: 'elastic.out(1.1,0.32)' });
          };
          pula(letra, -14, giro, 1.12);
          if (irmas[i - 1]) pula(irmas[i - 1], -6, giro * -.4, 1.04);
          if (irmas[i + 1]) pula(irmas[i + 1], -6, giro * -.4, 1.04);
        });
      });

      /* botões magnéticos */
      if (matchMedia('(pointer:fine)').matches) {
        document.querySelectorAll('.btn').forEach(btn => {
          const xTo = gsap.quickTo(btn, 'x', { duration: .35, ease: 'power3.out' });
          const yTo = gsap.quickTo(btn, 'y', { duration: .35, ease: 'power3.out' });
          btn.addEventListener('pointermove', e => {
            const r = btn.getBoundingClientRect();
            xTo((e.clientX - r.left - r.width / 2) * .25);
            yTo((e.clientY - r.top - r.height / 2) * .3);
          });
          btn.addEventListener('pointerleave', () => {
            gsap.to(btn, { x: 0, y: 0, duration: .7, ease: 'elastic.out(1,0.35)' });
          });
        });
      }

      /* rede de segurança: nenhuma letra pode ficar presa fora do lugar */
      setTimeout(() => {
        letras.forEach(l => {
          const t = getComputedStyle(l).transform;
          if (t !== 'none') { gsap.killTweensOf(l); gsap.set(l, { clearProps: 'all' }); }
        });
      }, 4000);
    });
  </script>
